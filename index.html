    <!-- Prevent theme flash - apply theme before React loads -->
    <script>
      (function() {
        var theme = localStorage.getItem('bloxcity-theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
